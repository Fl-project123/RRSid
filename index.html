<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>RRSid - Rail Role Simulator Indonesia</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0b0e19" />
    
    <!-- Memaksa orientasi utama aplikasi ke landscape untuk mode mobile standalone -->
    <meta name="screen-orientation" content="landscape">
    <meta name="fullscreen" content="yes">

    <style>
      /* Gaya Dasar Struktur Utama */
      body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #050811;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }

      /* Tombol Install PWA Modern */
      #pwa-install-container {
        display: none; /* Disembunyikan secara default, aktif lewat JS */
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 9999;
        background: linear-gradient(135deg, #111827 0%, #1f2937 100%);
        padding: 12px 20px;
        border-radius: 14px;
        border: 1px solid #10b981;
        box-shadow: 0 10px 25px rgba(16, 185, 129, 0.2);
        align-items: center;
        gap: 16px;
        color: #ffffff;
      }
      #pwa-install-container p {
        margin: 0;
        font-size: 14px;
        font-weight: 500;
      }
      #pwa-btn-install {
        background: #10b981;
        color: #050811;
        border: none;
        padding: 8px 16px;
        border-radius: 8px;
        font-weight: 700;
        cursor: pointer;
        font-size: 13px;
        transition: all 0.2s ease;
      }
      #pwa-btn-install:hover {
        background: #34d399;
        box-shadow: 0 0 12px #10b981;
      }

      /* Splash Screen Kustom RRSid */
      #rrsid-splash-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #000000;
        z-index: 9998;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        transition: opacity 0.5s ease-out, visibility 0.5s;
      }

      /* Gambar Neon Berdasarkan File Referensi Anda */
      .splash-logo {
        max-width: 80%;
        max-height: 65vh;
        object-fit: contain;
        filter: drop-shadow(0 0 20px rgba(16, 185, 129, 0.3));
      }

      /* Kontainer Loading Bar Modern */
      .loading-container {
        margin-top: 24px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        width: 280px;
      }

      /* Teks Loading Berkedip Neon */
      .loading-text {
        color: #10b981;
        font-size: 14px;
        font-weight: bold;
        letter-spacing: 3px;
        text-transform: uppercase;
        text-shadow: 0 0 8px rgba(16, 185, 129, 0.6);
        animation: pulse 1.5s infinite ease-in-out;
      }

      /* Progress Bar Berjalan */
      .progress-bar-bg {
        width: 100%;
        height: 6px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 10px;
        overflow: hidden;
        position: relative;
        border: 1px solid rgba(16, 185, 129, 0.2);
      }

      .progress-bar-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #10b981, #34d399);
        border-radius: 10px;
        box-shadow: 0 0 10px #10b981;
        animation: loadProgress 2.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }

      @keyframes pulse {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 1; text-shadow: 0 0 15px rgba(16, 185, 129, 0.9); }
      }

      @keyframes loadProgress {
        0% { width: 0%; }
        20% { width: 15%; }
        45% { width: 50%; }
        70% { width: 85%; }
        100% { width: 100%; }
      }

      /* Peringatan Rotasi Paksa jika Layar Masih Portrait */
      #rotate-warning {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #050811;
        z-index: 10000;
        color: #ffffff;
        text-align: center;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        padding: 20px;
        box-sizing: border-box;
      }
      #rotate-warning p {
        font-size: 18px;
        color: #10b981;
        font-weight: bold;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>

    <!-- Komponen Peringatan Rotasi (Wajib Landscape) -->
    <div id="rotate-warning">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2">
        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
      </svg>
      <p>Mohon Putar Perangkat Anda ke Posisi Landscape (Mendatar) Untuk Memulai RRSid</p>
    </div>

    <!-- Splash Screen Khusus Saat Pembukaan Aplikasi Standalone -->
    <div id="rrsid-splash-screen">
      <!-- Memuat gambar bawaan dengan nama berkas orisinal secara presisi -->
      <img src="/WhatsApp Image 2026-05-30 at 09.03.49.jpeg" alt="RRSid Neon Splash" class="splash-logo" />
      <div class="loading-container">
        <div class="loading-text">Dinasan Sedang Dimuat...</div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="splash-bar"></div>
        </div>
      </div>
    </div>

    <!-- Tombol Banner Pop-Up Install Aplikasi -->
    <div id="pwa-install-container">
      <p>Pasang RRSid di Beranda Layar Anda?</p>
      <button id="pwa-btn-install">INSTALL</button>
    </div>

    <!-- Target Root React -->
    <div id="root"></div>

    <!-- Script Kontrol Sistem PWA, Orientasi, & Splash Lifespan -->
    <script type="module">
      let deferredPrompt;
      const installContainer = document.getElementById('pwa-install-container');
      const btnInstall = document.getElementById('pwa-btn-install');
      const splashScreen = document.getElementById('rrsid-splash-screen');
      const rotateWarning = document.getElementById('rotate-warning');

      // 1. Deteksi Orientasi Layar (Wajib Landscape)
      function checkOrientation() {
        if (window.innerHeight > window.innerWidth) {
          rotateWarning.style.display = 'flex';
        } else {
          rotateWarning.style.display = 'none';
        }
      }
      window.addEventListener('resize', checkOrientation);
      window.addEventListener('orientationchange', checkOrientation);
      checkOrientation(); // Jalankan pengecekan awal

      // 2. Deteksi Mode Luncuran (Jika dijalankan lewat Aplikasi Terinstal / Standalone)
      const isRunningStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
      
      if (isRunningStandalone) {
        // Jika dibuka dari aplikasi terinstal, sembunyikan bar install & kunci fungsi rotasi otomatis jika didukung
        installContainer.style.display = 'none';
        if (screen.orientation && screen.orientation.lock) {
          screen.orientation.lock('landscape').catch(() => {});
        }
      } else {
        // Jika dijalankan lewat browser web biasa, hilangkan durasi splash screen panjang agar cepat responsif
        splashScreen.style.display = 'none';
      }

      // 3. Menangani Logika Penangkapan Banner Instalasi PWA
      window.addEventListener('beforeinstallprompt', (e) => {
        // Mencegah browser memunculkan mini-infobar bawaan secara otomatis
        e.preventDefault();
        deferredPrompt = e;
        // Hanya munculkan tombol jika bukan di dalam mode terinstal
        if (!isRunningStandalone) {
          installContainer.style.display = 'flex';
        }
      });

      // Aksi Klik Tombol Pasang
      btnInstall.addEventListener('click', async () => {
        if (!deferredPrompt) return;
        installContainer.style.display = 'none';
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        console.log(`User response to install: ${outcome}`);
        deferredPrompt = null;
      });

      // Menghilangkan kontainer jika aplikasi sukses terpasang
      window.addEventListener('appinstalled', () => {
        installContainer.style.display = 'none';
        deferredPrompt = null;
        console.log('RRSid Berhasil Ditambahkan ke Ruang Kerja Perangkat Anda.');
      });

      // 4. Timer Penyelesaian Splash Screen Menuju Game Utama
      window.addEventListener('load', () => {
        if (isRunningStandalone) {
          // Menunggu progress bar selesai berjalan penuh (2.5 detik)
          setTimeout(() => {
            splashScreen.style.opacity = '0';
            setTimeout(() => {
              splashScreen.style.visibility = 'hidden';
              splashScreen.style.display = 'none';
            }, 500); // Durasi transisi fade-out halus
          }, 2600);
        }
      });
    </script>

    <!-- Sumber Kode Skrip Utama React Vite -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
